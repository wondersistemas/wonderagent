agent:
  client-id: "CONFIGURE-ME"         # imutável, gerado no onboarding
  version: "1.0.0-SNAPSHOT"
  poll-interval: "PT300S"           # ISO 8601 duration — PT30S=30s, PT5M=5min
  home: "C:/ProgramData/WonderAgent" # raiz de logs, downloads e wildfly padrão

"%dev":
  agent:
    client-id: "dev-local"
    poll-interval: "PT30S"
    home: "${user.home}/.wonderagent-dev"

quarkus:
  banner:
    enabled: false
  index-dependency:
    zsync:
      group-id: io.takari.zsync
      artifact-id: zsync-core
  rest-client:
    central-api:
      url: "${agent.central-url:https://deploy.wonder.com.br}"
      headers:
        Authorization: "Bearer ${agent.jwt-token:}"

  log:
    level: WARN
    console:
      enable: true
    file:
      enable: true
      path: "${agent.home}/logs/agent.log"
      level: INFO
      rotation:
        max-file-size: 50M
        max-backup-index: 5

driver:
  type: "wildfly"                   # tipo de driver: wildfly, quarkus, proxy
  wildfly:
    home: "${agent.home}/wildfly"   # sobrescreva se o WildFly estiver em outro lugar
    management-port: 9990
    deploy-path: "${driver.wildfly.home}/standalone/deployments"
    artifact-name: "wnfe.war"
    start-timeout-seconds: 180
    stop-timeout-seconds: 60
    health-check-url: "http://localhost:8080/probusweb/health"

db:
  # Conexão Oracle para leitura de gerenciador.id_versaodb.
  # Se url estiver vazio, a leitura de versão de banco é ignorada.
  # Configurar em C:\ProgramData\WonderAgent\.env:
  #   DB_URL=jdbc:oracle:thin:@//localhost:1521/ORCL
  #   DB_USERNAME=usuario
  #   DB_PASSWORD=senha
  url: "${DB_URL:}"
  username: "${DB_USERNAME:}"
  password: "${DB_PASSWORD:}"

download:
  temp-dir: "${agent.home}/downloads"
  connect-timeout-seconds: 30
  read-timeout-seconds: 120
  max-retries: 3
  repository:
    url: "http://192.168.0.86:8082"   # base URL do Reposilite
    username: "reader"                 # usuário read-only
    # senha lida de C:\ProgramData\WonderAgent\.env:
    #   WONDER_REPO_PASSWORD=senha-aqui
    password: "${WONDER_REPO_PASSWORD:}"

wildfly:
  provisioning:
    repo-path: "wnfe-releases"         # repositório no Reposilite
    # Fixa uma versão específica do WildFly provisionado.
    # Se ausente (padrão), usa a versão enviada pelo servidor central via desired-state.
    # Para fixar, adicione em C:\ProgramData\WonderAgent\.env:
    #   WILDFLY_PROVISIONING_VERSION=1.0.0-SNAPSHOT
    fixed-version: "${WILDFLY_PROVISIONING_VERSION:}"
